name: Temporary Cargo lock refresh

on:
  push:
    branches:
      - feat/desktop-native-file-transfer

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/desktop-native-file-transfer
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Generate Cargo lock
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit generated lock if changed
        run: |
          git add desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "desktop: refresh compatible Tauri dependency lock"
          git push origin HEAD:feat/desktop-native-file-transfer
