name: Production release build

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: write
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: wedecent-production-release
    env:
      WEDECENT_BUILD_MODE: production
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - name: Build production Windows release
        shell: bash
        run: ./scripts/build-windows-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-windows-amd64-${{ github.sha }}
          path: dist/wedecent-windows-amd64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: wedecent-production-release
    env:
      WEDECENT_BUILD_MODE: production
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - name: Build production Linux releases
        run: |
          GOARCH=amd64 ./scripts/build-linux-release.sh
          GOARCH=arm64 ./scripts/build-linux-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-linux-${{ github.sha }}
          path: |
            dist/wedecent-linux-amd64/
            dist/wedecent-linux-arm64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    environment:
      name: wedecent-production-release
    env:
      WEDECENT_BUILD_MODE: production
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - name: Build production macOS releases
        run: |
          GOARCH=amd64 ./scripts/build-macos-release.sh
          GOARCH=arm64 ./scripts/build-macos-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-macos-${{ github.sha }}
          path: |
            dist/wedecent-macos-amd64/
            dist/wedecent-macos-arm64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
