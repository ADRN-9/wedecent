name: Production release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

env:
  WEDECENT_PROVENANCE_PREDICATE_TYPE: https://wedecent.com/attestations/release-provenance/v1

jobs:
  validate-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable stable release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"

  windows:
    needs: validate-release-tag
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment:
      name: wedecent-production-release
    env:
      WEDECENT_BUILD_MODE: production
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_HOSTNAME: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_HOSTNAME }}
      WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - name: Recheck live release tag before Windows build
        shell: bash
        run: ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Build production Windows release
        shell: bash
        run: ./scripts/build-windows-release.sh
      - name: Build production Windows installer package
        shell: bash
        run: ./scripts/build-windows-installer-package.sh
      - name: Create Windows release provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/provenance"
          python ./scripts/release-provenance.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/wedecent-windows-amd64" \
            --output "$GITHUB_WORKSPACE/dist/provenance/wedecent-windows-amd64.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name wedecent-windows-amd64 \
            --platform windows/amd64
          python ./scripts/release-provenance.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/wedecent-windows-installer" \
            --output "$GITHUB_WORKSPACE/dist/provenance/wedecent-windows-installer.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name wedecent-windows-installer \
            --platform windows/amd64
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/provenance/wedecent-windows-amd64.json
          predicate-type: ${{ env.WEDECENT_PROVENANCE_PREDICATE_TYPE }}
          predicate-path: dist/provenance/wedecent-windows-amd64.json
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/provenance/wedecent-windows-installer.json
          predicate-type: ${{ env.WEDECENT_PROVENANCE_PREDICATE_TYPE }}
          predicate-path: dist/provenance/wedecent-windows-installer.json
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-windows-${{ github.sha }}
          path: |
            dist/wedecent-windows-amd64/
            dist/wedecent-windows-installer/
            dist/provenance/wedecent-windows-amd64.json
            dist/provenance/wedecent-windows-installer.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  linux:
    needs: validate-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment:
      name: wedecent-production-release
    env:
      WEDECENT_BUILD_MODE: production
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_HOSTNAME: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_HOSTNAME }}
      WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - name: Recheck live release tag before Linux build
        run: ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Build production Linux releases
        run: |
          GOARCH=amd64 ./scripts/build-linux-release.sh
          GOARCH=arm64 ./scripts/build-linux-release.sh
      - name: Create Linux release provenance
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/provenance"
          python3 ./scripts/release-provenance.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/wedecent-linux-amd64" \
            --output "$GITHUB_WORKSPACE/dist/provenance/wedecent-linux-amd64.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name wedecent-linux-amd64 \
            --platform linux/amd64
          python3 ./scripts/release-provenance.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/wedecent-linux-arm64" \
            --output "$GITHUB_WORKSPACE/dist/provenance/wedecent-linux-arm64.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name wedecent-linux-arm64 \
            --platform linux/arm64
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/provenance/wedecent-linux-amd64.json
          predicate-type: ${{ env.WEDECENT_PROVENANCE_PREDICATE_TYPE }}
          predicate-path: dist/provenance/wedecent-linux-amd64.json
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/provenance/wedecent-linux-arm64.json
          predicate-type: ${{ env.WEDECENT_PROVENANCE_PREDICATE_TYPE }}
          predicate-path: dist/provenance/wedecent-linux-arm64.json
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-linux-${{ github.sha }}
          path: |
            dist/wedecent-linux-amd64/
            dist/wedecent-linux-arm64/
            dist/provenance/wedecent-linux-amd64.json
            dist/provenance/wedecent-linux-arm64.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  macos:
    needs: validate-release-tag
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment:
      name: wedecent-production-release
    env:
      WEDECENT_BUILD_MODE: production
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_HOSTNAME: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_HOSTNAME }}
      WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - name: Recheck live release tag before macOS build
        run: ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Build production macOS releases
        run: |
          GOARCH=amd64 ./scripts/build-macos-release.sh
          GOARCH=arm64 ./scripts/build-macos-release.sh
      - name: Create macOS release provenance
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/provenance"
          python3 ./scripts/release-provenance.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/wedecent-macos-amd64" \
            --output "$GITHUB_WORKSPACE/dist/provenance/wedecent-macos-amd64.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name wedecent-macos-amd64 \
            --platform darwin/amd64
          python3 ./scripts/release-provenance.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/wedecent-macos-arm64" \
            --output "$GITHUB_WORKSPACE/dist/provenance/wedecent-macos-arm64.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name wedecent-macos-arm64 \
            --platform darwin/arm64
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/provenance/wedecent-macos-amd64.json
          predicate-type: ${{ env.WEDECENT_PROVENANCE_PREDICATE_TYPE }}
          predicate-path: dist/provenance/wedecent-macos-amd64.json
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/provenance/wedecent-macos-arm64.json
          predicate-type: ${{ env.WEDECENT_PROVENANCE_PREDICATE_TYPE }}
          predicate-path: dist/provenance/wedecent-macos-arm64.json
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-macos-${{ github.sha }}
          path: |
            dist/wedecent-macos-amd64/
            dist/wedecent-macos-arm64/
            dist/provenance/wedecent-macos-amd64.json
            dist/provenance/wedecent-macos-arm64.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  verify-artifacts:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck live release tag before artifact verification
        shell: bash
        run: ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wedecent-windows-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wedecent-linux-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wedecent-macos-${{ github.sha }}
          path: dist
      - name: Verify all platform provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          verify_provenance() {
            local directory="$1"
            local statement="$2"
            local artifact_name="$3"
            local platform="$4"
            gh attestation verify "$statement" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/production-release-build.yml" \
              --predicate-type "$WEDECENT_PROVENANCE_PREDICATE_TYPE" \
              --source-ref "$GITHUB_REF" >/dev/null
            python3 ./scripts/release-provenance.py verify \
              --repo-root "$GITHUB_WORKSPACE" \
              --directory "$directory" \
              --provenance "$statement" \
              --repository "$GITHUB_REPOSITORY" \
              --expected-commit "$GITHUB_SHA" \
              --artifact-name "$artifact_name" \
              --platform "$platform"
          }
          verify_provenance dist/wedecent-windows-amd64 dist/provenance/wedecent-windows-amd64.json wedecent-windows-amd64 windows/amd64
          verify_provenance dist/wedecent-windows-installer dist/provenance/wedecent-windows-installer.json wedecent-windows-installer windows/amd64
          verify_provenance dist/wedecent-linux-amd64 dist/provenance/wedecent-linux-amd64.json wedecent-linux-amd64 linux/amd64
          verify_provenance dist/wedecent-linux-arm64 dist/provenance/wedecent-linux-arm64.json wedecent-linux-arm64 linux/arm64
          verify_provenance dist/wedecent-macos-amd64 dist/provenance/wedecent-macos-amd64.json wedecent-macos-amd64 darwin/amd64
          verify_provenance dist/wedecent-macos-arm64 dist/provenance/wedecent-macos-arm64.json wedecent-macos-arm64 darwin/arm64
          (
            cd dist/wedecent-windows-amd64
            sha256sum -c SHA256SUMS.txt
          )
          (
            cd dist/wedecent-windows-installer
            sha256sum -c SHA256SUMS.txt
            sha256sum -c PACKAGE_SHA256SUMS.txt
          )
          for directory in \
            dist/wedecent-linux-amd64 dist/wedecent-linux-arm64 \
            dist/wedecent-macos-amd64 dist/wedecent-macos-arm64; do
            (cd "$directory" && sha256sum -c SHA256SUMS.txt)
          done

  windows-signing:
    needs: verify-artifacts
    runs-on: [self-hosted, windows, wedecent-signing]
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    environment:
      name: wedecent-production-signing
    env:
      WEDECENT_BUILD_MODE: production
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_HOSTNAME: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_HOSTNAME }}
      WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256 }}
      WEDECENT_WINDOWS_AUTHENTICODE_SIGNER: ${{ vars.WEDECENT_WINDOWS_AUTHENTICODE_SIGNER }}
      WEDECENT_WINDOWS_AUTHENTICODE_VERIFIER: ${{ vars.WEDECENT_WINDOWS_AUTHENTICODE_VERIFIER }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on missing protected signing inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ADRN-9/wedecent" ]]
          [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "v$(tr -d '\r\n' < VERSION)" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          [[ "$WEDECENT_PRODUCTION_RELEASE_APPROVED" == "true" ]]
          [[ -n "$WEDECENT_REPLAY_AUTHORITY_HOSTNAME" ]]
          [[ -n "$WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256" ]]
          [[ -n "$WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256" ]]
          [[ -n "$WEDECENT_CHECKPOINT_AUDIT_HOSTNAME" ]]
          [[ -n "$WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256" ]]
          [[ -n "$WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256" ]]
          for name in WEDECENT_WINDOWS_AUTHENTICODE_SIGNER WEDECENT_WINDOWS_AUTHENTICODE_VERIFIER; do
            value="${!name}"
            [[ "$value" == /* && -f "$value" && -x "$value" && ! -L "$value" ]]
          done
          for command in gh python git sha256sum realpath; do
            command -v "$command" >/dev/null 2>&1
          done
      - name: Recheck live release tag before artifact verification
        shell: bash
        run: ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wedecent-windows-${{ github.sha }}
          path: dist
      - name: Verify unsigned Windows provenance before signing
        shell: bash
        run: |
          set -euo pipefail
          verify_provenance() {
            local directory="$1"
            local statement="$2"
            local artifact_name="$3"
            gh attestation verify "$statement" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/production-release-build.yml" \
              --predicate-type "$WEDECENT_PROVENANCE_PREDICATE_TYPE" \
              --source-ref "$GITHUB_REF" >/dev/null
            python ./scripts/release-provenance.py verify \
              --repo-root "$GITHUB_WORKSPACE" \
              --directory "$directory" \
              --provenance "$statement" \
              --repository "$GITHUB_REPOSITORY" \
              --expected-commit "$GITHUB_SHA" \
              --artifact-name "$artifact_name" \
              --platform windows/amd64
          }
          verify_provenance dist/wedecent-windows-amd64 dist/provenance/wedecent-windows-amd64.json wedecent-windows-amd64
          verify_provenance dist/wedecent-windows-installer dist/provenance/wedecent-windows-installer.json wedecent-windows-installer
      - name: Recheck live release tag immediately before Authenticode signing
        shell: bash
        run: ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Finalize signed Windows release and installer
        shell: bash
        run: |
          ./scripts/finalize-windows-signed-artifacts.sh
      - name: Create signed Windows provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/provenance-signed"
          python ./scripts/release-provenance.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/wedecent-windows-signed/release" \
            --output "$GITHUB_WORKSPACE/dist/provenance-signed/wedecent-windows-signed-release.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name wedecent-windows-signed-release \
            --platform windows/amd64
          python ./scripts/release-provenance.py create \
            --repo-root "$GITHUB_WORKSPACE" \
            --directory "$GITHUB_WORKSPACE/dist/wedecent-windows-signed/installer" \
            --output "$GITHUB_WORKSPACE/dist/provenance-signed/wedecent-windows-signed-installer.json" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --artifact-name wedecent-windows-signed-installer \
            --platform windows/amd64
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/provenance-signed/wedecent-windows-signed-release.json
          predicate-type: ${{ env.WEDECENT_PROVENANCE_PREDICATE_TYPE }}
          predicate-path: dist/provenance-signed/wedecent-windows-signed-release.json
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/provenance-signed/wedecent-windows-signed-installer.json
          predicate-type: ${{ env.WEDECENT_PROVENANCE_PREDICATE_TYPE }}
          predicate-path: dist/provenance-signed/wedecent-windows-signed-installer.json
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-windows-signed-${{ github.sha }}
          path: |
            dist/wedecent-windows-signed/
            dist/provenance-signed/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish-windows-downloads:
    needs: windows-signing
    runs-on:
      group: wedecent-release-publishers
      labels: [self-hosted, linux, wedecent-release-publisher]
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    environment:
      name: wedecent-production-publication
    env:
      WEDECENT_BUILD_MODE: production
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_HOSTNAME: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_HOSTNAME }}
      WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256 }}
      WEDECENT_WINDOWS_AUTHENTICODE_VERIFIER: ${{ vars.WEDECENT_WINDOWS_AUTHENTICODE_VERIFIER }}
      WEDECENT_R2_CREATE_ONLY_UPLOADER: ${{ vars.WEDECENT_R2_CREATE_ONLY_UPLOADER }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on missing protected publication inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ADRN-9/wedecent" ]]
          [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "v$(tr -d '\r\n' < VERSION)" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          [[ "$WEDECENT_PRODUCTION_RELEASE_APPROVED" == "true" ]]
          [[ -n "$WEDECENT_REPLAY_AUTHORITY_HOSTNAME" ]]
          [[ -n "$WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256" ]]
          [[ -n "$WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256" ]]
          [[ -n "$WEDECENT_CHECKPOINT_AUDIT_HOSTNAME" ]]
          [[ -n "$WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256" ]]
          [[ -n "$WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256" ]]
          for name in WEDECENT_WINDOWS_AUTHENTICODE_VERIFIER WEDECENT_R2_CREATE_ONLY_UPLOADER; do
            value="${!name}"
            [[ "$value" == /* && -f "$value" && -x "$value" && ! -L "$value" ]]
          done
          for command in gh python3 git curl sha256sum realpath; do
            command -v "$command" >/dev/null 2>&1
          done
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wedecent-windows-signed-${{ github.sha }}
          path: dist
      - name: Verify signed Windows provenance before publication
        shell: bash
        run: |
          set -euo pipefail
          verify_provenance() {
            local directory="$1"
            local statement="$2"
            local artifact_name="$3"
            gh attestation verify "$statement" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/production-release-build.yml" \
              --predicate-type "$WEDECENT_PROVENANCE_PREDICATE_TYPE" \
              --source-ref "$GITHUB_REF" >/dev/null
            python3 ./scripts/release-provenance.py verify \
              --repo-root "$GITHUB_WORKSPACE" \
              --directory "$directory" \
              --provenance "$statement" \
              --repository "$GITHUB_REPOSITORY" \
              --expected-commit "$GITHUB_SHA" \
              --artifact-name "$artifact_name" \
              --platform windows/amd64
          }
          verify_provenance dist/wedecent-windows-signed/release dist/provenance-signed/wedecent-windows-signed-release.json wedecent-windows-signed-release
          verify_provenance dist/wedecent-windows-signed/installer dist/provenance-signed/wedecent-windows-signed-installer.json wedecent-windows-signed-installer
      - name: Recheck live release tag immediately before immutable publication
        shell: bash
        run: ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Publish immutable signed Windows downloads
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          ./scripts/publish-windows-downloads.sh \
            --version "v$version" \
            --signed-release "$GITHUB_WORKSPACE/dist/wedecent-windows-signed/release" \
            --signed-installer "$GITHUB_WORKSPACE/dist/wedecent-windows-signed/installer"

  sign-stable-update:
    needs: publish-windows-downloads
    runs-on:
      group: wedecent-update-signers
      labels: [self-hosted, linux, wedecent-update-signer]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: wedecent-production-update-signing
    env:
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_HOSTNAME: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_HOSTNAME }}
      WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256 }}
      WEDECENT_UPDATE_MANIFEST_SIGNER: ${{ vars.WEDECENT_UPDATE_MANIFEST_SIGNER }}
      WEDECENT_UPDATE_MANIFEST_SIGNER_SHA256: ${{ vars.WEDECENT_UPDATE_MANIFEST_SIGNER_SHA256 }}
      WEDECENT_UPDATE_ROOT_KEY_ID: ${{ vars.WEDECENT_UPDATE_ROOT_KEY_ID }}
      WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH: ${{ vars.WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH }}
      WEDECENT_UPDATE_KEYSET_PATH: ${{ vars.WEDECENT_UPDATE_KEYSET_PATH }}
      WEDECENT_UPDATE_KEYSET_SIGNATURE_PATH: ${{ vars.WEDECENT_UPDATE_KEYSET_SIGNATURE_PATH }}
      WEDECENT_UPDATE_SIGNING_KEY_ID: ${{ vars.WEDECENT_UPDATE_SIGNING_KEY_ID }}
      WEDECENT_UPDATE_KEYSET_EPOCH: ${{ vars.WEDECENT_UPDATE_KEYSET_EPOCH }}
      WEDECENT_UPDATE_SEQUENCE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - name: Set stable manifest timestamp
        shell: bash
        run: printf 'WEDECENT_UPDATE_PUBLISHED_AT=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Validate signer-only workload inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ADRN-9/wedecent" ]]
          [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "v$(tr -d '\r\n' < VERSION)" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$WEDECENT_PRODUCTION_RELEASE_APPROVED" == "true" ]]
          [[ "$WEDECENT_UPDATE_MANIFEST_SIGNER" == /* && -f "$WEDECENT_UPDATE_MANIFEST_SIGNER" && -x "$WEDECENT_UPDATE_MANIFEST_SIGNER" && ! -L "$WEDECENT_UPDATE_MANIFEST_SIGNER" ]]
          [[ "$WEDECENT_UPDATE_MANIFEST_SIGNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WEDECENT_UPDATE_ROOT_KEY_ID" =~ ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$ ]]
          [[ "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" == /* && -f "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" && ! -L "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" ]]
          [[ "$WEDECENT_UPDATE_KEYSET_PATH" == /* && -f "$WEDECENT_UPDATE_KEYSET_PATH" && ! -L "$WEDECENT_UPDATE_KEYSET_PATH" ]]
          [[ "$WEDECENT_UPDATE_KEYSET_SIGNATURE_PATH" == /* && -f "$WEDECENT_UPDATE_KEYSET_SIGNATURE_PATH" && ! -L "$WEDECENT_UPDATE_KEYSET_SIGNATURE_PATH" ]]
          [[ "$WEDECENT_UPDATE_SIGNING_KEY_ID" =~ ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$ ]]
          [[ "$WEDECENT_UPDATE_KEYSET_EPOCH" =~ ^[1-9][0-9]*$ ]]
          [[ "$WEDECENT_UPDATE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          for name in WEDECENT_REPLAY_AUTHORITY_HOSTNAME WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 WEDECENT_CHECKPOINT_AUDIT_HOSTNAME WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256; do
            [[ -n "${!name}" ]]
          done
      - name: Sign canonical stable update candidate
        shell: bash
        run: |
          bash ./scripts/sign-windows-stable-update.sh \
            --version "v$(tr -d '\r\n' < VERSION)" \
            --sequence "$WEDECENT_UPDATE_SEQUENCE" \
            --published-at "$WEDECENT_UPDATE_PUBLISHED_AT" \
            --out-dir "$RUNNER_TEMP/stable-update-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-stable-update-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/stable-update-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify-stable-update:
    needs: sign-stable-update
    runs-on:
      group: wedecent-update-verifiers
      labels: [self-hosted, linux, wedecent-update-verifier]
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment:
      name: wedecent-production-update-verification
    env:
      WEDECENT_UPDATE_ROOT_KEY_ID: ${{ vars.WEDECENT_UPDATE_ROOT_KEY_ID }}
      WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH: ${{ vars.WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wedecent-stable-update-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/stable-update-candidate
      - name: Verify candidate signature, canonical bytes and rollback policy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WEDECENT_UPDATE_ROOT_KEY_ID" =~ ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$ ]]
          [[ "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" == /* && -f "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" && ! -L "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" ]]
          ./scripts/verify-live-release-tag.sh "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          bash ./scripts/verify-windows-stable-update.sh \
            --root-key-id "$WEDECENT_UPDATE_ROOT_KEY_ID" \
            --root-public-key "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" \
            --keyset "$RUNNER_TEMP/stable-update-candidate/keyset-v1.json" \
            --keyset-signature "$RUNNER_TEMP/stable-update-candidate/keyset-v1.sig" \
            --manifest "$RUNNER_TEMP/stable-update-candidate/manifest-v2.json" \
            --signature "$RUNNER_TEMP/stable-update-candidate/manifest-v2.sig" \
            --receipt "$RUNNER_TEMP/stable-update-candidate/verification.receipt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wedecent-stable-update-verified-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/stable-update-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-stable-update:
    needs: verify-stable-update
    runs-on:
      group: wedecent-release-publishers
      labels: [self-hosted, linux, wedecent-release-publisher]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    environment:
      name: wedecent-production-publication
    env:
      WEDECENT_PRODUCTION_RELEASE_APPROVED: ${{ vars.WEDECENT_PRODUCTION_RELEASE_APPROVED }}
      WEDECENT_REPLAY_AUTHORITY_HOSTNAME: ${{ vars.WEDECENT_REPLAY_AUTHORITY_HOSTNAME }}
      WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 }}
      WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256: ${{ vars.WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_HOSTNAME: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_HOSTNAME }}
      WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 }}
      WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256: ${{ vars.WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256 }}
      WEDECENT_UPDATE_ROOT_KEY_ID: ${{ vars.WEDECENT_UPDATE_ROOT_KEY_ID }}
      WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH: ${{ vars.WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH }}
      WEDECENT_R2_ACCOUNT_ID: ${{ vars.WEDECENT_R2_ACCOUNT_ID }}
      WEDECENT_R2_BUCKET: ${{ vars.WEDECENT_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.WEDECENT_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.WEDECENT_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wedecent-stable-update-verified-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/stable-update-verified
      - name: Validate publisher-only workload inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ADRN-9/wedecent" ]]
          [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == "v$(tr -d '\r\n' < VERSION)" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$WEDECENT_PRODUCTION_RELEASE_APPROVED" == "true" ]]
          [[ "$WEDECENT_UPDATE_ROOT_KEY_ID" =~ ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$ ]]
          [[ "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" == /* && -f "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" && ! -L "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" ]]
          [[ "$WEDECENT_R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]
          aws --version | grep -q '^aws-cli/2\.'
          for name in WEDECENT_REPLAY_AUTHORITY_HOSTNAME WEDECENT_REPLAY_AUTHORITY_SPKI_SHA256 WEDECENT_REPLAY_AUTHORITY_APPROVAL_SHA256 WEDECENT_CHECKPOINT_AUDIT_HOSTNAME WEDECENT_CHECKPOINT_AUDIT_SPKI_SHA256 WEDECENT_CHECKPOINT_AUDIT_APPROVAL_SHA256; do
            [[ -n "${!name}" ]]
          done
      - name: Publish independently verified stable pair
        shell: bash
        run: |
          bash ./scripts/publish-windows-stable-update-pair.sh \
            --root-key-id "$WEDECENT_UPDATE_ROOT_KEY_ID" \
            --root-public-key "$WEDECENT_UPDATE_ROOT_PUBLIC_KEY_PATH" \
            --keyset "$RUNNER_TEMP/stable-update-verified/keyset-v1.json" \
            --keyset-signature "$RUNNER_TEMP/stable-update-verified/keyset-v1.sig" \
            --manifest "$RUNNER_TEMP/stable-update-verified/manifest-v2.json" \
            --signature "$RUNNER_TEMP/stable-update-verified/manifest-v2.sig" \
            --pair "$RUNNER_TEMP/stable-update-verified/current-v2.json" \
            --receipt "$RUNNER_TEMP/stable-update-verified/verification.receipt"
