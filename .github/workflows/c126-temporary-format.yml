name: C126 temporary Go formatting

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  format-checkpoint-files:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/secure-port-forwarding-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.0'
      - name: Format C126 files
        run: gofmt -w internal/portforward/replay_checkpoint.go internal/portforward/replay_checkpoint_test.go internal/portforward/replay_checkpoint_recovery_test.go
      - name: Commit formatting only when needed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add internal/portforward/replay_checkpoint.go internal/portforward/replay_checkpoint_test.go internal/portforward/replay_checkpoint_recovery_test.go
            git commit -m 'style: format C126 replay checkpoint files'
            git push origin "HEAD:$BRANCH"
          fi
