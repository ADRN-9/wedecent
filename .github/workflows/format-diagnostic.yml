name: Format diagnostic

on:
  push:
    branches:
      - feat/typed-stream-wire-schema-v3

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Show typed stream formatter diff
        run: gofmt -d internal/protocol/typed_stream.go
