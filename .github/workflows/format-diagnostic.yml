name: Format diagnostic

on:
  push:
    branches:
      - feat/core-connection-latency

permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Print unformatted Go files
        run: |
          files="$(gofmt -l cmd internal)"
          printf '%s\n' "$files"
          test -z "$files"
