name: Native dependency lock generation

on:
  push:
    branches:
      - feat/desktop-native-file-transfer

permissions:
  contents: write

jobs:
  lockgen:
    if: ${{ !contains(github.event.head_commit.message, 'commit generated native dependency lock') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Generate lock
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit generated native dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'desktop: commit generated native dependency lock'
          git push origin HEAD:feat/desktop-native-file-transfer
