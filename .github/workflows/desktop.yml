name: Desktop shell

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  linux-tauri-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Bootstrap desktop dependency lock
        if: github.event_name == 'push' && github.ref_name == 'feat/phase4-tauri-shell'
        run: |
          if test -f desktop/src-tauri/Cargo.lock; then
            exit 0
          fi
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src-tauri/Cargo.lock
          git commit -m 'chore: lock desktop Rust dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Require committed dependency lock
        run: test -f desktop/src-tauri/Cargo.lock
      - name: Compile locked Tauri shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
