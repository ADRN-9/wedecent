name: Desktop shell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-tauri-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Require committed dependency lock
        run: test -f desktop/src-tauri/Cargo.lock
      - name: Test locked desktop bridge boundary
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Compile locked Tauri shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check renderer JavaScript syntax
        run: node --check desktop/dist/app.js
      - name: Build fixed local status bridge helper
        run: go build -trimpath -buildvcs=false -o desktop/src-tauri/target/debug/wd-desktop-bridge ./cmd/wd-desktop-bridge
      - name: Verify fixed helper command surface
        run: desktop/src-tauri/target/debug/wd-desktop-bridge version

  windows-tauri-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Test and compile locked Tauri shell
        run: |
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build fixed local status bridge helper
        run: go build -trimpath -buildvcs=false -o desktop/src-tauri/target/debug/wd-desktop-bridge.exe ./cmd/wd-desktop-bridge
      - name: Verify fixed helper command surface
        shell: pwsh
        run: .\desktop\src-tauri\target\debug\wd-desktop-bridge.exe version

  macos-tauri-check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Test and compile locked Tauri shell
        run: |
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build fixed local status bridge helper
        run: go build -trimpath -buildvcs=false -o desktop/src-tauri/target/debug/wd-desktop-bridge ./cmd/wd-desktop-bridge
      - name: Verify fixed helper command surface
        run: desktop/src-tauri/target/debug/wd-desktop-bridge version
