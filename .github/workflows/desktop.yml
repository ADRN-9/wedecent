name: Desktop shell

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  linux-tauri-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned desktop frontend dependency
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build pinned desktop frontend assets
        working-directory: desktop
        run: npm run build:assets
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Generate native picker dependency lock
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Upload generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: native-file-transfer-cargo-lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Wire and commit native file command surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('desktop/src-tauri/src/main.rs')
          text = path.read_text()
          if 'mod file_transfer;' not in text:
              text = 'mod file_transfer;\n\n' + text
          builder = '    tauri::Builder::default()\n        .manage(terminal_bridge)'
          replacement = '    tauri::Builder::default()\n        .plugin(tauri_plugin_dialog::init())\n        .manage(terminal_bridge)'
          if builder in text:
              text = text.replace(builder, replacement, 1)
          handler = '            terminal_stream_write,\n            terminal_stream_resize\n        ])'
          handler_replacement = '            terminal_stream_write,\n            terminal_stream_resize,\n            file_transfer::file_transfer_status,\n            file_transfer::file_upload_pick,\n            file_transfer::file_download_pick\n        ])'
          if handler in text:
              text = text.replace(handler, handler_replacement, 1)
          required = [
              'mod file_transfer;',
              '.plugin(tauri_plugin_dialog::init())',
              'file_transfer::file_transfer_status',
              'file_transfer::file_upload_pick',
              'file_transfer::file_download_pick',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing expected wiring after patch: {missing}')
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src-tauri/Cargo.lock desktop/src-tauri/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m 'desktop: wire native file transfer commands'
            git push origin HEAD:feat/desktop-native-file-transfer
          fi
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Require committed dependency lock
        run: test -f desktop/src-tauri/Cargo.lock
      - name: Test locked desktop bridge boundary
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Compile locked Tauri shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check renderer JavaScript syntax
        run: |
          node --check desktop/dist/app.js
          node --check desktop/dist/latency.js
          test -s desktop/dist/latency.css
          test -s desktop/dist/vendor/xterm.js
          test -s desktop/dist/vendor/xterm.css
          test -s desktop/dist/vendor/XTERM-LICENSE
      - name: Build fixed local status bridge helper
        run: go build -trimpath -buildvcs=false -o desktop/src-tauri/target/debug/wd-desktop-bridge ./cmd/wd-desktop-bridge
      - name: Verify fixed helper command surface
        run: desktop/src-tauri/target/debug/wd-desktop-bridge version

  windows-tauri-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and build pinned desktop frontend assets
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:assets
      - name: Select stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Generate native picker dependency lock
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Test and compile locked Tauri shell
        run: |
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build fixed local status bridge helper
        run: go build -trimpath -buildvcs=false -o desktop/src-tauri/target/debug/wd-desktop-bridge.exe ./cmd/wd-desktop-bridge
      - name: Verify fixed helper command surface
        shell: pwsh
        run: .\desktop\src-tauri\target\debug\wd-desktop-bridge.exe version

  macos-tauri-check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and build pinned desktop frontend assets
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:assets
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Generate native picker dependency lock
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Test and compile locked Tauri shell
        run: |
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
          cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build fixed local status bridge helper
        run: go build -trimpath -buildvcs=false -o desktop/src-tauri/target/debug/wd-desktop-bridge ./cmd/wd-desktop-bridge
      - name: Verify fixed helper command surface
        run: desktop/src-tauri/target/debug/wd-desktop-bridge version
