name: Managed multiplex format diagnostic
on:
  push:
    branches: [feat/typed-terminal-managed-client]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/typed-terminal-managed-client
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Apply gofmt
        run: gofmt -w internal/session/managed_multiplex.go
      - name: Commit formatter output
        run: |
          if git diff --quiet -- internal/session/managed_multiplex.go; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/session/managed_multiplex.go
          git commit -m "style: gofmt managed multiplex client"
          git push origin HEAD:feat/typed-terminal-managed-client
