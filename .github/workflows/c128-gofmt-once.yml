name: C128 one-time Go formatting
on:
  push:
    branches:
      - feat/secure-port-forwarding-foundation
    paths:
      - .github/workflows/c128-gofmt-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format C128 Go files
        run: gofmt -w internal/portforward/checkpoint_pending.go internal/portforward/checkpoint_request.go internal/portforward/replay_checkpoint.go internal/portforward/replay_witness.go internal/portforward/replay_witness_test.go
      - name: Commit formatting
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/portforward/checkpoint_pending.go internal/portforward/checkpoint_request.go internal/portforward/replay_checkpoint.go internal/portforward/replay_witness.go internal/portforward/replay_witness_test.go
          git commit -m "style: format C128 witness checkpoint implementation"
          git push origin "HEAD:$BRANCH"
