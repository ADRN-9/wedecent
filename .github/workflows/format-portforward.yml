name: One-time port-forward Go formatting

on:
  push:
    branches:
      - feat/secure-port-forwarding-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/secure-port-forwarding-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/secure-port-forwarding-foundation
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Normalize and format only this implementation batch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("internal/portforward").glob("*.go"):
              source = path.read_text()
              path.write_text(source.replace("\\`", "`"))
          PY
          gofmt -w \
            internal/portforward/*.go \
            internal/audit/log.go \
            internal/audit/log_test.go \
            internal/mesh/routeauth.go \
            internal/coreapi/coreprocess/process.go
          if git diff --quiet; then
            echo "Go files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/portforward \
            internal/audit/log.go \
            internal/audit/log_test.go \
            internal/mesh/routeauth.go \
            internal/coreapi/coreprocess/process.go
          git commit -m "style: format secure port-forwarding foundation"
          git push origin HEAD:refs/heads/feat/secure-port-forwarding-foundation
