name: One-time port-forward formatting

on:
  push:
    branches:
      - feat/secure-port-forwarding-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format port-forward Go sources
        run: gofmt -w internal/portforward/*.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Go sources are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/portforward/*.go
          git commit -m "chore(portforward): format authorization and lifecycle sources"
          git push
