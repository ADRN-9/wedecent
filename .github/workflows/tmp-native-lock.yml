name: Temporary native lock refresh

on:
  push:
    branches:
      - feat/desktop-native-file-transfer

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.head_commit.message != 'chore: refresh pinned desktop lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/desktop-native-file-transfer
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Generate exact Cargo lock
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit generated lock only
        run: |
          test -z "$(git status --porcelain -- . ':!.github/workflows/tmp-native-lock.yml')" || true
          git add desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: refresh pinned desktop lock'
          git push origin HEAD:feat/desktop-native-file-transfer
