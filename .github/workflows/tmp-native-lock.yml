name: Temporary native lock refresh

on:
  push:
    branches:
      - feat/desktop-native-file-transfer

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.head_commit.message != 'desktop: refresh pinned native dependency lock' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Refresh lockfile with pinned runtime family
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'desktop: refresh pinned native dependency lock'
          git push origin HEAD:feat/desktop-native-file-transfer
