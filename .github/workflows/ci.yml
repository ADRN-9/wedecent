name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  route-capability-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Run routed client regression gate
        run: |
          go test ./cmd/wd -run 'Test(AutomaticRouteAuthorization|BuildRoutedConnectRequest|OpenRoutedSourceRouterTrust|BuildRoutedDialer|PrepareRoutedDialer|RunConnectRejects|RunConnectRouted|RouteTrust)' -count=1
          go test ./cmd/wd -count=1

  route-e2e:
    needs: route-capability-client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Run deterministic A-B-C routed terminal e2e
        run: go test ./internal/meshruntime -run '^TestRoutedTerminalE2E$' -count=1 -v

  linux:
    needs: [route-capability-client, route-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test protocol version compatibility
        run: go test ./internal/protocol ./internal/coreapi/ipc ./internal/identity ./internal/transport ./internal/routercontrol -run '^TestProtocolVersionCompatibility' -count=1
      - name: Fuzz protocol decoders
        run: |
          go test ./internal/protocol -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime=5s
          go test ./internal/relayproto -run '^$' -fuzz '^FuzzRead$' -fuzztime=5s
      - name: Test with race detector
        run: go test -race ./...
      - name: Direct transport smoke test
        run: ./scripts/smoke-direct.sh
      - name: Outbound-only relay smoke test
        run: ./scripts/smoke-relay.sh

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Parse Windows installer scripts
        shell: pwsh
        run: |
          $files = @(
            'installer/windows/Install-WeDecent.ps1',
            'installer/windows/Uninstall-WeDecent.ps1',
            'installer/windows/Test-WeDecentInstall.ps1',
            'scripts/test-windows-upgrade-preflight.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
      - name: Verify Windows upgrade user-process preflight
        shell: pwsh
        run: .\scripts\test-windows-upgrade-preflight.ps1
      - name: Test native Windows agent
        run: go test ./...
      - name: Build native Windows binaries
        run: |
          go build -trimpath -buildvcs=false -o wd.exe ./cmd/wd
          go build -trimpath -buildvcs=false -o wd-agent.exe ./cmd/wd-agent
          go build -trimpath -buildvcs=false -o wd-routerctl.exe ./cmd/wd-routerctl
          go build -trimpath -buildvcs=false -o wd-core.exe ./cmd/wd-core
          go build -trimpath -buildvcs=false -o wd-ui.exe ./cmd/wd-ui
      - name: Verify native version and UI autostart status commands
        shell: pwsh
        run: |
          .\wd.exe version
          .\wd-agent.exe version
          .\wd-routerctl.exe version
          .\wd-core.exe version
          .\wd-ui.exe version
          .\wd-ui.exe autostart status

  windows-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Test stable signed update publication boundary
        run: bash ./scripts/test-windows-stable-update-publication.sh
      - name: Test Windows signing finalizer
        run: ./scripts/test-windows-signing-finalizer.sh
      - name: Test signed Windows public-download preparation
        run: ./scripts/test-windows-public-download-preparation.sh
      - name: Test signed Windows publication boundary
        run: ./scripts/test-windows-signed-publication.sh
      - name: Test public Windows archive verifier
        run: ./scripts/test-windows-public-verifier.sh
      - name: Test public Windows installer package
        run: ./scripts/test-windows-public-installer.sh
      - name: Verify reproducible Windows release bundle
        run: ./scripts/verify-windows-release-repro.sh
      - name: Build Windows release bundle
        run: ./scripts/build-windows-release.sh
      - name: Verify release checksums
        run: |
          cd dist/wedecent-windows-amd64
          sha256sum -c SHA256SUMS.txt
      - name: Build complete Windows installer package payload
        run: ./scripts/build-windows-installer-package.sh
      - name: Verify installer package checksums
        run: |
          cd dist/wedecent-windows-installer
          sha256sum -c SHA256SUMS.txt
          sha256sum -c PACKAGE_SHA256SUMS.txt

  relay-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned Worker tooling
        working-directory: cloudflare/relay-worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Worker syntax
        working-directory: cloudflare/relay-worker
        run: |
          node --check src/index.js
          node --check src/relay-auth.js
          node --check src/rate-limit.js
      - name: Test relay authentication and admission
        working-directory: cloudflare/relay-worker
        run: npm test
      - name: Validate Worker bundle and configuration
        working-directory: cloudflare/relay-worker
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wedecent-relay-worker-dry-run"

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check route authorization encoder syntax
        run: node --check supabase/functions/_shared/route-authorization.mjs
      - name: Test Go-compatible route authorization signing
        run: node --test supabase/functions/_shared/route-authorization.test.mjs
      - name: Type-check route authorization Edge Function
        run: deno check supabase/functions/route-authorization/index.ts

  supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Test registry fallback and throttle retry policy
        run: ./scripts/test-start-supabase-db-ci.sh
      - name: Start disposable local Supabase database
        run: ./scripts/start-supabase-db-ci.sh
      - name: Run database pgTAP tests
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY supabase test db
