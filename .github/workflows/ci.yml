name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Direct transport smoke test
        run: ./scripts/smoke-direct.sh
      - name: Outbound-only relay smoke test
        run: ./scripts/smoke-relay.sh

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Test native Windows agent
        run: go test ./...
      - name: Build native Windows agent
        run: go build -trimpath -o wd-agent.exe ./cmd/wd-agent

  relay-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Worker syntax
        working-directory: cloudflare/relay-worker
        run: |
          node --check src/index.js
          node --check src/relay-auth.js
      - name: Test relay authentication
        working-directory: cloudflare/relay-worker
        run: npm test
