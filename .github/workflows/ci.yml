name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  route-capability-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Run routed client regression gate
        run: |
          go test ./cmd/wd -run 'Test(AutomaticRouteAuthorization|BuildRoutedConnectRequest|OpenRoutedSourceRouterTrust|BuildRoutedDialer|PrepareRoutedDialer|RunConnectRejects|RunConnectRouted|RouteTrust)' -count=1
          go test ./cmd/wd -count=1

  route-e2e:
    needs: route-capability-client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Run deterministic A-B-C routed terminal e2e
        run: go test ./internal/meshruntime -run '^TestRoutedTerminalE2E$' -count=1 -v

  linux:
    needs: [route-capability-client, route-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Verify formatting
        run: |
          formatting_diff="$(gofmt -d cmd internal)"
          if [ -n "$formatting_diff" ]; then
            printf '%s\n' "$formatting_diff"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Direct transport smoke test
        run: ./scripts/smoke-direct.sh
      - name: Outbound-only relay smoke test
        run: ./scripts/smoke-relay.sh

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Test native Windows agent
        run: go test ./...
      - name: Build native Windows binaries
        run: |
          go build -trimpath -buildvcs=false -o wd.exe ./cmd/wd
          go build -trimpath -buildvcs=false -o wd-agent.exe ./cmd/wd-agent
      - name: Verify native version commands
        shell: pwsh
        run: |
          .\wd.exe version
          .\wd-agent.exe version

  windows-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Verify reproducible Windows release bundle
        run: ./scripts/verify-windows-release-repro.sh
      - name: Build Windows release bundle
        run: ./scripts/build-windows-release.sh
      - name: Verify release checksums
        run: |
          cd dist/wedecent-windows-amd64
          sha256sum -c SHA256SUMS.txt

  relay-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Worker syntax
        working-directory: cloudflare/relay-worker
        run: |
          node --check src/index.js
          node --check src/relay-auth.js
      - name: Test relay authentication
        working-directory: cloudflare/relay-worker
        run: npm test

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check route authorization encoder syntax
        run: node --check supabase/functions/_shared/route-authorization.mjs
      - name: Test Go-compatible route authorization signing
        run: node --test supabase/functions/_shared/route-authorization.test.mjs
      - name: Type-check route authorization Edge Function
        run: deno check supabase/functions/route-authorization/index.ts

  supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable local Supabase database
        run: supabase db start
      - name: Run database pgTAP tests
        run: supabase test db
