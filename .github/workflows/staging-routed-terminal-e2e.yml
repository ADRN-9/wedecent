name: Staging Routed Terminal E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedecent-staging-routed-terminal-e2e
  cancel-in-progress: false

jobs:
  staging-routed-terminal-e2e:
    runs-on:
      - self-hosted
      - linux
      - wedecent-staging-e2e
    timeout-minutes: 10
    environment: wedecent-staging
    env:
      WEDECENT_STAGING_SUPABASE_URL: ${{ secrets.WEDECENT_STAGING_SUPABASE_URL }}
      WEDECENT_STAGING_PUBLISHABLE_KEY: ${{ secrets.WEDECENT_STAGING_PUBLISHABLE_KEY }}
      WEDECENT_STAGING_ACCOUNT_EMAIL: ${{ secrets.WEDECENT_STAGING_ACCOUNT_EMAIL }}
      WEDECENT_STAGING_ACCOUNT_PASSWORD: ${{ secrets.WEDECENT_STAGING_ACCOUNT_PASSWORD }}
      WEDECENT_STAGING_ROUTE_AUTHORITY_JSON: ${{ secrets.WEDECENT_STAGING_ROUTE_AUTHORITY_JSON }}
    steps:
      - name: Refuse non-staging targets
        shell: bash
        run: |
          set -euo pipefail
          expected_staging='https://kefwiuqipnkbcqpxwqha.supabase.co'
          production='https://hopraknkfzxpdijhcjzv.supabase.co'
          expected_kid='TWxSlC-My5Z9h-lD9mrTmeKx7amqhfVEvRsMK6kpUdc'

          if [[ "${WEDECENT_STAGING_SUPABASE_URL:-}" == "$production" ]]; then
            echo 'refusing production Supabase project' >&2
            exit 1
          fi
          if [[ "${WEDECENT_STAGING_SUPABASE_URL:-}" != "$expected_staging" ]]; then
            echo 'refusing unknown Supabase project; expected WeDecent Staging' >&2
            exit 1
          fi

          for name in \
            WEDECENT_STAGING_PUBLISHABLE_KEY \
            WEDECENT_STAGING_ACCOUNT_EMAIL \
            WEDECENT_STAGING_ACCOUNT_PASSWORD \
            WEDECENT_STAGING_ROUTE_AUTHORITY_JSON; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is not configured" >&2
              exit 1
            fi
          done

          if ! command -v python3 >/dev/null 2>&1; then
            echo 'python3 is required on the self-hosted staging runner' >&2
            exit 1
          fi

          EXPECTED_KID="$expected_kid" python3 - <<'PY'
          import json
          import os
          import sys

          try:
              authority = json.loads(os.environ["WEDECENT_STAGING_ROUTE_AUTHORITY_JSON"])
          except (KeyError, json.JSONDecodeError):
              print("staging route authority JSON is invalid", file=sys.stderr)
              raise SystemExit(1)

          valid = (
              authority.get("version") == 1
              and authority.get("key_id") == os.environ["EXPECTED_KID"]
              and isinstance(authority.get("public_key"), str)
              and bool(authority["public_key"].strip())
          )
          if not valid:
              print(
                  "staging route authority JSON is invalid or has the wrong key id",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

          echo 'WEDECENT_STAGING_ROUTED_TERMINAL_TARGET_GUARD_OK'

      - name: Check out WeDecent
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run live staging routed terminal E2E
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          state_dir="$HOME/.local/share/wedecent-staging-routed-terminal-e2e"
          install -d -m 700 "$state_dir"

          export WEDECENT_STAGING_E2E_STATE_DIR="$state_dir"
          export WEDECENT_STAGING_ROUTED_TERMINAL_E2E=1

          go test ./internal/meshruntime \
            -run '^TestStagingRoutedTerminalE2E$' \
            -count=1 \
            -v

          echo 'WEDECENT_STAGING_ROUTED_TERMINAL_E2E_WORKFLOW_OK'

      - name: Run adversarial router-source trust check
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          state_dir="$HOME/.local/share/wedecent-staging-routed-terminal-e2e"
          install -d -m 700 "$state_dir"

          export WEDECENT_STAGING_E2E_STATE_DIR="$state_dir"
          export WEDECENT_STAGING_ROUTED_TERMINAL_E2E=1

          go test ./internal/meshruntime \
            -run '^TestStagingRoutedTerminalAdversarialRouterSourceTrust$' \
            -count=1 \
            -v

          echo 'WEDECENT_STAGING_ROUTED_TERMINAL_ADVERSARIAL_ROUTER_SOURCE_TRUST_WORKFLOW_OK'

      - name: Run adversarial source-router trust check
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          state_dir="$HOME/.local/share/wedecent-staging-routed-terminal-e2e"
          install -d -m 700 "$state_dir"

          export WEDECENT_STAGING_E2E_STATE_DIR="$state_dir"
          export WEDECENT_STAGING_ROUTED_TERMINAL_E2E=1

          go test ./internal/meshruntime \
            -run '^TestStagingRoutedTerminalAdversarialSourceRouterTrust$' \
            -count=1 \
            -v

          echo 'WEDECENT_STAGING_ROUTED_TERMINAL_ADVERSARIAL_SOURCE_ROUTER_TRUST_WORKFLOW_OK'

      - name: Run adversarial router-destination trust check
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          state_dir="$HOME/.local/share/wedecent-staging-routed-terminal-e2e"
          install -d -m 700 "$state_dir"

          export WEDECENT_STAGING_E2E_STATE_DIR="$state_dir"
          export WEDECENT_STAGING_ROUTED_TERMINAL_E2E=1

          go test ./internal/meshruntime \
            -run '^TestStagingRoutedTerminalAdversarialRouterDestinationTrust$' \
            -count=1 \
            -v

          echo 'WEDECENT_STAGING_ROUTED_TERMINAL_ADVERSARIAL_ROUTER_DESTINATION_TRUST_WORKFLOW_OK'

      - name: Run adversarial destination-router trust check
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          state_dir="$HOME/.local/share/wedecent-staging-routed-terminal-e2e"
          install -d -m 700 "$state_dir"

          export WEDECENT_STAGING_E2E_STATE_DIR="$state_dir"
          export WEDECENT_STAGING_ROUTED_TERMINAL_E2E=1

          go test ./internal/meshruntime \
            -run '^TestStagingRoutedTerminalAdversarialDestinationRouterTrust$' \
            -count=1 \
            -v

          echo 'WEDECENT_STAGING_ROUTED_TERMINAL_ADVERSARIAL_DESTINATION_ROUTER_TRUST_WORKFLOW_OK'
