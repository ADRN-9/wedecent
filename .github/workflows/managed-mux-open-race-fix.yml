name: Managed multiplex open race fix
on:
  push:
    branches: [feat/typed-terminal-managed-client]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/typed-terminal-managed-client
      - name: Apply reviewed cancellation fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path("internal/session/managed_multiplex.go")
          text = path.read_text()
          old = '''\tif err := s.writeFrameContext(ctx, protocol.Frame{Type: protocol.TypeStreamOpen, StreamID: id, Payload: payload}); err != nil {
          \t\ts.removeChild(id)
          \t\treturn 0, err
          \t}
          \tselect {
          \tcase <-ctx.Done():
          \t\ts.removeChild(id)
          \t\treturn 0, ctx.Err()
          '''
          new = '''\tif err := s.writeFrameContext(ctx, protocol.Frame{Type: protocol.TypeStreamOpen, StreamID: id, Payload: payload}); err != nil {
          \t\t_ = s.finish()
          \t\treturn 0, err
          \t}
          \tselect {
          \tcase <-ctx.Done():
          \t\t// Once StreamOpen has been written, acceptance is ambiguous. Keep
          \t\t// fail-closed semantics by ending the parent rather than deleting
          \t\t// the child and treating a late valid StreamAccepted as unknown.
          \t\t_ = s.finish()
          \t\treturn 0, ctx.Err()
          '''
          if text.count(old) != 1:
              raise SystemExit("open cancellation source block not found exactly once")
          text = text.replace(old, new)
          old = '''func (s *ManagedMultiplexTerminal) CloseTerminalStream(ctx context.Context, id uint32) error {
          \tchild, typed, err := s.child(id)
          '''
          new = '''func (s *ManagedMultiplexTerminal) CloseTerminalStream(ctx context.Context, id uint32) error {
          \tif err := ctx.Err(); err != nil {
          \t\treturn err
          \t}
          \tchild, typed, err := s.child(id)
          '''
          if text.count(old) != 1:
              raise SystemExit("close context source block not found exactly once")
          text = text.replace(old, new)
          path.write_text(text)
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Format and commit
        run: |
          gofmt -w internal/session/managed_multiplex.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/session/managed_multiplex.go
          git commit -m "fix: fail closed on ambiguous stream open"
          git push origin HEAD:feat/typed-terminal-managed-client
