name: WD-C05 Temporary Source Snapshot

on:
  push:
    branches:
      - security/atomic-pairing-wd-c03

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Upload public Go source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: wd-c05-source
          path: |
            cmd
            internal
            go.mod
            go.sum
            docs/PROTOCOL.md
          retention-days: 1
          if-no-files-found: error
