[package]
name = "wedecent-desktop"
version = "0.1.0"
description = "WeDecent desktop presentation shell"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"
