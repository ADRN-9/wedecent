<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>WeDecent</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell" aria-labelledby="app-title">
    <header>
      <p class="eyebrow">WeDecent desktop</p>
      <h1 id="app-title">Secure terminal</h1>
    </header>
    <section class="status" aria-live="polite">
      <strong>Desktop shell ready</strong>
      <p>Local Core integration is intentionally not enabled in this scaffold.</p>
    </section>
    <p class="boundary">Trust, routing, transport selection, cryptography, and session authority remain outside this renderer.</p>
  </main>
</body>
</html>
